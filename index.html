body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif}
.top{max-width:1180px;margin:0 auto;padding:28px 20px 0}

.sub{margin:0 0 18px;color:var(--muted);font-size:14px}

</div>

.ruler{margin-top:20px}

.ruler .seg{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 12px;font-size:12px;line-height:1.3;color:var(--muted);border-right:2px solid var(--panel)}
.ruler .seg:nth-child(odd){background:var(--band-a)}
.ruler .seg:nth-child(even){background:var(--band-b)}
.ruler .seg:first-child{border-radius:10px 0 0 10px}
.ruler .seg:last-child{border-radius:0 10px 10px 0;border-right:0}
.ruler .seg b{color:var(--ink);font-size:13px;font-weight:700}

.marker{position:absolute;width:0;z-index:2}
.marker::before{content:&quot;&quot;;position:absolute;left:-6px;border-left:6px solid transparent;border-right:6px solid transparent}
.marker i{position:absolute;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:6px}
.marker.promo{top:0}

.marker.promo i{top:0;background:var(--plum);color:var(--panel)}
.marker.full{bottom:0}
.marker.full::before{bottom:22px;border-bottom:8px solid var(--muted)}
.marker.full i{bottom:0;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.ruler .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.ruler .legend span::before{content:&quot;&quot;;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ruler .legend .lp::before{background:var(--plum)}
.ruler .legend .lf::before{background:var(--panel);border:1px solid var(--muted)}
.ruler .legend .lb::before{background:var(--plum-soft);box-shadow:inset 0 0 0 2px var(--plum)}

.alerts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.alert{padding:10px 14px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.alert.ok{background:var(--profit-soft);border-left-color:var(--profit)}

.tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:720px){.tables{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}

.sub{font-size:12px;color:var(--muted);margin:-8px 0 12px}

&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;Precificação Shopee&lt;/h1&gt;
    &lt;p&gt;Preencha seus custos e metas. As taxas da Shopee (comissão, taxa fixa e frete grátis embutido) entram automaticamente conforme a faixa de preço.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;!-- ENTRADAS --&gt;
    &lt;aside class=&quot;panel&quot; aria-label=&quot;Seus dados&quot;&gt;
      &lt;h2&gt;Seus dados&lt;/h2&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;custo&quot;&gt;Custo do produto&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;custo&quot; inputmode=&quot;decimal&quot; data-key=&quot;custo&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;margem&quot;&gt;Margem desejada sobre o custo&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;margem&quot; inputmode=&quot;decimal&quot; data-key=&quot;margem&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;emb&quot;&gt;Embalagem&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;emb&quot; inputmode=&quot;decimal&quot; data-key=&quot;emb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;vend&quot;&gt;Comissão do vendedor&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;vend&quot; inputmode=&quot;decimal&quot; data-key=&quot;vend&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;ads&quot;&gt;ADS&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;ads&quot; inputmode=&quot;decimal&quot; data-key=&quot;ads&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;nf&quot;&gt;Nota fiscal&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;nf&quot; inputmode=&quot;decimal&quot; data-key=&quot;nf&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;desc&quot;&gt;Desconto da promoção&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;desc&quot; inputmode=&quot;decimal&quot; data-key=&quot;desc&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;O preço cheio é calculado para que, com esse desconto, o preço final seja o preço promocional&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arred&quot;&gt;Final do preço promocional&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;select id=&quot;arred&quot; data-key=&quot;arred&quot;&gt;
          &lt;option value=&quot;exato&quot;&gt;Exato (mínimo para a margem)&lt;/option&gt;
          &lt;option value=&quot;90&quot;&gt;Terminar em ,90&lt;/option&gt;
          &lt;option value=&quot;99&quot;&gt;Terminar em ,99&lt;/option&gt;
          &lt;option value=&quot;98&quot;&gt;Terminar em ,98&lt;/option&gt;

    &lt;!-- RESULTADOS --&gt;
    &lt;main&gt;
      &lt;section class=&quot;hero&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;promo&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço promocional (o que o cliente paga)&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;promoV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;promoS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;full&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço cheio para cadastrar&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;fullV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;fullS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ruler panel&quot; style=&quot;margin-top:20px&quot; aria-label=&quot;Faixas de taxa da Shopee&quot;&gt;

        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;inner&quot; id=&quot;inner&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;lp&quot;&gt;Preço promocional&lt;/span&gt;&lt;span class=&quot;lf&quot;&gt;Preço cheio&lt;/span&gt;&lt;span class=&quot;lb&quot;&gt;Faixa do preço promocional&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;sub&quot; id=&quot;subPromo&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tPromo&quot;&gt;&lt;/table&gt;&lt;/div&gt;

          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tFull&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;

            &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;simP&quot; inputmode=&quot;decimal&quot; placeholder=&quot;Ex.: 94,90&quot; data-key=&quot;simP&quot;&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;summary&gt;Tabela de taxas da Shopee (CNPJ)&lt;/summary&gt;
        &lt;p class=&quot;note&quot; style=&quot;margin:12px 0&quot;&gt;Vigente desde março/2026. O frete grátis já está embutido na comissão e na taxa fixa. Se a Shopee mudar as taxas, edite aqui: todos os cálculos se atualizam e a tabela fica salva neste navegador.&lt;/p&gt;
        &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl-edit&quot; id=&quot;tBands&quot;&gt;&lt;/table&gt;&lt;/div&gt;

          &lt;span class=&quot;note&quot; id=&quot;bandsStatus&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/main&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  var DEFAULT_INPUTS = {custo:&quot;34,56&quot;, margem:&quot;30&quot;, emb:&quot;1,00&quot;, vend:&quot;4&quot;, ads:&quot;10&quot;, nf:&quot;10&quot;, desc:&quot;30&quot;, arred:&quot;exato&quot;, simP:&quot;&quot;};
  // meia = taxa fixa é 50% do preço (itens abaixo de R$ 8)
  var DEFAULT_BANDS = [
    {min:0,   max:7.99,   pct:20, fixo:0,  meia:true},
    {min:8,   max:79.99,  pct:20, fixo:4,  meia:false},
    {min:80,  max:99.99,  pct:14, fixo:16, meia:false},
    {min:100, max:199.99, pct:14, fixo:20, meia:false},
    {min:200, max:Infinity, pct:14, fixo:26, meia:false}
  ];
  var LS_IN = &quot;shopeePricing.inputs.v1&quot;, LS_B = &quot;shopeePricing.bands.v1&quot;;

  function load(key, fallback){
    try{ var raw = localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }catch(e){ return fallback; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  var inputs = Object.assign({}, DEFAULT_INPUTS, load(LS_IN, {}));
  var bands = (load(LS_B, null) || DEFAULT_BANDS).map(function(b){ return Object.assign({}, b, {max: (b.max===null||b.max===&quot;inf&quot;) ? Infinity : b.max}); });

  var $ = function(id){ return document.getElementById(id); };
  var num = function(s){ if(s===undefined||s===null) return NaN; s=String(s).trim().replace(/\s/g,&quot;&quot;).replace(&quot;R$&quot;,&quot;&quot;); if(s.indexOf(&quot;,&quot;)&gt;-1){ s=s.replace(/\./g,&quot;&quot;).replace(&quot;,&quot;,&quot;.&quot;); } return parseFloat(s); };
  var brl = function(v){ return isFinite(v) ? v.toLocaleString(&quot;pt-BR&quot;,{style:&quot;currency&quot;,currency:&quot;BRL&quot;}) : &quot;–&quot;; };
  var pct = function(v,d){ return isFinite(v) ? (v*100).toLocaleString(&quot;pt-BR&quot;,{minimumFractionDigits:d===undefined?1:d,maximumFractionDigits:d===undefined?1:d})+&quot;%&quot; : &quot;–&quot;; };
  var r2 = function(v){ return Math.round(v*100)/100; };
  var fmtN = function(v){ return v===Infinity ? &quot;&quot; : String(v).replace(&quot;.&quot;,&quot;,&quot;); };

  function bandOf(P){
    for(var i=0;i&lt;bands.length;i++){ if(P&gt;=bands[i].min-1e-9 &amp;&amp; P&lt;=bands[i].max+0.004) return i; }
    for(var j=0;j&lt;bands.length-1;j++){ if(P&gt;bands[j].max &amp;&amp; P&lt;bands[j+1].min) return j+1; }
    return bands.length-1;
  }

  function params(){
    return {
      C:num(inputs.custo)||0, M:(num(inputs.margem)||0)/100, E:num(inputs.emb)||0,
      v:(num(inputs.vend)||0)/100, a:(num(inputs.ads)||0)/100, n:(num(inputs.nf)||0)/100,
      d:(num(inputs.desc)||0)/100
    };
  }

  function breakdown(P, p){
    var bi = bandOf(P), b = bands[bi];
    var com = P*b.pct/100, fixo = b.meia ? P*0.5 : b.fixo;
    var vend = P*p.v, ads = P*p.a, nf = P*p.n;
    var lucro = P - com - fixo - vend - ads - nf - p.C - p.E;
    return {P:P, bi:bi, b:b, com:com, fixo:fixo, vend:vend, ads:ads, nf:nf, lucro:lucro,
            mCusto: p.C&gt;0 ? lucro/p.C : NaN, mVenda: P&gt;0 ? lucro/P : NaN};
  }

  // menor preço que atinge o lucro-alvo
  function minPrice(p){
    var L = p.C*p.M, best = null;
    bands.forEach(function(b){
      var denom = 1 - b.pct/100 - p.v - p.a - p.n - (b.meia?0.5:0);
      if(denom&lt;=0) return;
      var P = (p.C + p.E + (b.meia?0:b.fixo) + L)/denom;
      if(P &lt; b.min) P = b.min;
      if(P &gt; b.max + 1e-9) return;
      P = Math.ceil(P*100 - 1e-6)/100;
      if(P &gt; b.max + 1e-9) return;
      if(best===null || P &lt; best) best = P;
    });
    return best;
  }

  function applyEnding(P, mode){
    if(mode===&quot;exato&quot;) return P;
    var cents = parseInt(mode,10)/100, bi = bandOf(P), max = bands[bi].max;
    var base = Math.floor(P), cand = base + cents;
    if(cand &lt; P - 1e-9) cand += 1;
    cand = r2(cand);

  }

  function fullFromPromo(promo, d, p){
    if(d&lt;=0) return {full:promo, promoReal:promo};
    if(d&gt;=1) return null;
    var full = Math.ceil(promo/(1-d)*100 - 1e-6)/100;
    var real = r2(full*(1-d));

    var guard = 0;
    while(real &gt; maxBand + 1e-9 &amp;&amp; guard&lt;5){ full = r2(full-0.01); real = r2(full*(1-d)); guard++; }
    return {full:full, promoReal:real};
  }

  function rows(bd, p){
    var labelFixo = bd.b.meia ? &quot;Taxa fixa Shopee (50% do preço)&quot; : &quot;Taxa fixa Shopee&quot;;
    var list = [
      [&quot;Preço de venda&quot;, &quot;100,0%&quot;, bd.P, &quot;&quot;],
      [&quot;Comissão Shopee (frete incluso)&quot;, pct(bd.b.pct/100), -bd.com, &quot;&quot;],
      [labelFixo, bd.b.meia?&quot;50,0%&quot;:&quot;&quot;, -bd.fixo, &quot;&quot;],
      [&quot;Comissão do vendedor&quot;, pct(p.v), -bd.vend, &quot;&quot;],
      [&quot;ADS&quot;, pct(p.a), -bd.ads, &quot;&quot;],
      [&quot;Nota fiscal&quot;, pct(p.n), -bd.nf, &quot;&quot;],
      [&quot;Custo do produto&quot;, &quot;&quot;, -p.C, &quot;&quot;],
      [&quot;Embalagem&quot;, &quot;&quot;, -p.E, &quot;&quot;]
    ];
    var h = &#x27;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;%&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;R$&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    list.forEach(function(r){ h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+r[1]+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+brl(r[2])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;; });
    h += &#x27;&lt;tr class=&quot;total&#x27;+(bd.lucro&lt;0?&#x27; neg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;td&gt;Lucro líquido&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+pct(bd.mVenda)+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+brl(bd.lucro)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    h += &#x27;&lt;tr&gt;&lt;td class=&quot;note&quot; colspan=&quot;2&quot;&gt;Margem sobre o custo&lt;/td&gt;&lt;td class=&quot;n note&quot;&gt;&#x27;+pct(bd.mCusto)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    return h + &#x27;&lt;/tbody&gt;&#x27;;
  }

  function bandLabel(b){
    if(b.min===0) return &quot;Até &quot;+brl(b.max);
    if(b.max===Infinity) return &quot;A partir de &quot;+brl(b.min);
    return brl(b.min)+&quot; a &quot;+brl(b.max);
  }
  function bandFee(b){ return b.meia ? b.pct+&quot;% + 50% do preço&quot; : b.pct+&quot;% + &quot;+brl(b.fixo); }

  function drawRuler(promoBd, fullBd){
    var bar = $(&quot;bar&quot;), inner = $(&quot;inner&quot;);
    var h = &quot;&quot;;
    bands.forEach(function(b,i){
      var on = (promoBd &amp;&amp; promoBd.bi===i) ? &quot; on&quot; : &quot;&quot;;
      h += &#x27;&lt;div class=&quot;seg&#x27;+on+&#x27;&quot;&gt;&lt;b&gt;&#x27;+bandFee(b)+&#x27;&lt;/b&gt;&lt;span&gt;&#x27;+bandLabel(b)+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    });
    bar.innerHTML = h;
    inner.querySelectorAll(&quot;.marker&quot;).forEach(function(m){ m.remove(); });
    function place(bd, cls, text){
      if(!bd) return;
      var b = bands[bd.bi], w = 100/bands.length;
      var top = b.max===Infinity ? Math.max(b.min*2, 400) : b.max;
      var frac = Math.min(1, Math.max(0,(bd.P-b.min)/(top-b.min)));

    place(promoBd, &quot;promo&quot;, &quot;Promo &quot;+brl(promoBd &amp;&amp; promoBd.P));
    if(fullBd &amp;&amp; (!promoBd || fullBd.P!==promoBd.P)) place(fullBd, &quot;full&quot;, &quot;Cheio &quot;+brl(fullBd.P));
  }

  function drawBandsTable(){
    var h = &#x27;&lt;colgroup&gt;&lt;col style=&quot;width:56px&quot;&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;/colgroup&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Faixa&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;De (R$)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Até (R$)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Comissão (%)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Taxa fixa (R$)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    bands.forEach(function(b,i){
      h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+(i+1)+&#x27;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;min&quot; value=&quot;&#x27;+fmtN(b.min)+&#x27;&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; valor inicial&quot;&gt;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;max&quot; value=&quot;&#x27;+(b.max===Infinity?&quot;&quot;:fmtN(b.max))+&#x27;&quot; placeholder=&quot;sem limite&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; valor final&quot;&gt;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;pct&quot; value=&quot;&#x27;+fmtN(b.pct)+&#x27;&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; comissão&quot;&gt;&lt;/td&gt;&#x27;+

  function render(){
    var p = params(), alerts = [];
    var minP = minPrice(p);
    var promoBd = null, fullBd = null, promoInfo = null;

    if(minP===null || !(p.C&gt;0)){
      $(&quot;promoV&quot;).textContent = &quot;–&quot;; $(&quot;fullV&quot;).textContent = &quot;–&quot;;

      if(p.C&gt;0) alerts.push([&quot;Os percentuais sobre a venda (Shopee + vendedor + ADS + nota) somam 100% ou mais. Reduza algum deles.&quot;, false]);

      fullBd = breakdown(fullP, p);

      $(&quot;fullV&quot;).textContent = p.d&gt;0 ? brl(fullP) : brl(promoP);
      $(&quot;fullS&quot;).innerHTML = p.d&gt;0 ? &quot;Com &quot;+pct(p.d,0)+&quot; de desconto → &quot;+brl(promoP)+&quot; · lucro sem promoção &quot;+brl(fullBd.lucro) : &quot;Sem desconto de promoção&quot;;

      $(&quot;tPromo&quot;).innerHTML = rows(promoBd, p);

        alerts.push([&quot;O preço cheio precisa ter sido praticado de verdade antes da promoção. A Shopee pode recusar ofertas relâmpago com desconto sobre um preço recém-aumentado.&quot;, false]);
      }
      drawRuler(promoBd, fullBd);
    }

    // simulação
    var sp = num(inputs.simP);
    if(sp&gt;0){
      var sb = breakdown(sp, p);
      $(&quot;tSim&quot;).innerHTML = rows(sb, p);
    } else {
      $(&quot;tSim&quot;).innerHTML = &#x27;&lt;tbody&gt;&lt;tr&gt;&lt;td class=&quot;note&quot;&gt;Digite um preço para ver a composição e o lucro nele.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&#x27;;
    }

    $(&quot;alerts&quot;).innerHTML = alerts.map(function(a){ return &#x27;&lt;div class=&quot;alert&#x27;+(a[1]?&#x27; ok&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+a[0]+&#x27;&lt;/div&gt;&#x27;; }).join(&quot;&quot;);
  }

  // ligar entradas
  document.querySelectorAll(&quot;[data-key]&quot;).forEach(function(el){
    el.value = inputs[el.dataset.key] || &quot;&quot;;
    el.addEventListener(&quot;input&quot;, function(){ inputs[el.dataset.key] = el.value; save(LS_IN, inputs); render(); });
  });
  $(&quot;reset-inputs&quot;).addEventListener(&quot;click&quot;, function(){
    inputs = Object.assign({}, DEFAULT_INPUTS); save(LS_IN, inputs);

    render();
  });

  $(&quot;tBands&quot;).addEventListener(&quot;input&quot;, function(e){
    var t = e.target; if(!t.dataset || t.dataset.b===undefined) return;

    $(&quot;bandsStatus&quot;).textContent = &quot;Tabela personalizada salva.&quot;;
    render();
  });
  $(&quot;resetBands&quot;).addEventListener(&quot;click&quot;, function(){
    bands = DEFAULT_BANDS.map(function(b){ return Object.assign({}, b); });
    try{ localStorage.removeItem(LS_B); }catch(e){}
    $(&quot;bandsStatus&quot;).textContent = &quot;Tabela de março/2026 restaurada.&quot;;
    drawBandsTable(); render();
  });

  drawBandsTable();
  render();
})();
&lt;/script&gt;

.hero .v{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.hero .promo .v{color:var(--plum)}
.hero .full .v{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--muted)}
.hero .s{font-size:13px;color:var(--muted)}

.ruler{margin-top:20px}
.ruler .track{overflow-x:auto;padding:0 2px}
.ruler .inner{min-width:640px;position:relative;padding:34px 0 38px}
.ruler .bar{position:relative;display:flex;min-height:64px;border-radius:10px}
.ruler .seg{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 12px;font-size:12px;line-height:1.3;color:var(--muted);border-right:2px solid var(--panel)}
.ruler .seg:nth-child(odd){background:var(--band-a)}
.ruler .seg:nth-child(even){background:var(--band-b)}
.ruler .seg:first-child{border-radius:10px 0 0 10px}
.ruler .seg:last-child{border-radius:0 10px 10px 0;border-right:0}
.ruler .seg b{color:var(--ink);font-size:13px;font-weight:700}
.ruler .seg.on{box-shadow:inset 0 0 0 2px var(--plum);background:var(--plum-soft)}
.marker{position:absolute;width:0;z-index:2}
.marker::before{content:&quot;&quot;;position:absolute;left:-6px;border-left:6px solid transparent;border-right:6px solid transparent}
.marker i{position:absolute;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:6px}
.marker.promo{top:0}
.marker.promo::before{top:22px;border-top:8px solid var(--plum)}
.marker.promo i{top:0;background:var(--plum);color:var(--panel)}
.marker.full{bottom:0}
.marker.full::before{bottom:22px;border-bottom:8px solid var(--muted)}
.marker.full i{bottom:0;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.ruler .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.ruler .legend span::before{content:&quot;&quot;;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ruler .legend .lp::before{background:var(--plum)}
.ruler .legend .lf::before{background:var(--panel);border:1px solid var(--muted)}
.ruler .legend .lb::before{background:var(--plum-soft);box-shadow:inset 0 0 0 2px var(--plum)}

.alerts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.alert{padding:10px 14px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.alert.ok{background:var(--profit-soft);border-left-color:var(--profit)}

.tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:720px){.tables{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0;padding-top:10px}
tr.total td.n{color:var(--profit)}
tr.neg td.n{color:var(--warn)}
.sub{font-size:12px;color:var(--muted);margin:-8px 0 12px}

details{margin-top:20px}
summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:&quot;+&quot;;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--plum-soft);color:var(--plum);font-weight:800}
details[open] summary::before{content:&quot;−&quot;}
.tbl-edit{table-layout:fixed;min-width:560px}
.tbl-edit th,.tbl-edit td{padding:8px 6px;vertical-align:middle}
.tbl-edit th{text-align:right}
.tbl-edit th:first-child,.tbl-edit td:first-child{width:56px;text-align:center}
.tbl-edit td.n{text-align:right;padding-right:14px}
.tbl-edit input{display:block;width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink);font:inherit;font-weight:600;padding:6px 8px;text-align:right}
.tbl-edit input:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button{font:inherit;font-weight:700;font-size:13px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--plum);border-color:var(--plum);color:var(--panel)}
button:focus-visible{outline:3px solid var(--plum-soft);outline-offset:1px}
.note{font-size:12px;color:var(--muted)}
.seg-tog{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--field)}

.seg-tog button.on{background:var(--plum);color:var(--panel)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.compare &gt; div{padding:14px 20px;cursor:pointer}
.compare &gt; div + div{border-left:1px solid var(--line)}
.compare &gt; div.on{background:var(--plum-soft)}
.compare .k{font-size:12px;color:var(--muted);font-weight:600}
.compare .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.compare .s{font-size:12px;color:var(--muted)}
.fees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:4px 0 16px}

.sim{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.sim .field{margin:0;flex:1;min-width:160px}

&lt;style&gt;header{display:none}.wrap{padding-top:0}.grid{margin-top:16px}&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;Precificação Mercado Livre&lt;/h1&gt;
    &lt;p&gt;Preencha seus custos e metas. As taxas do Mercado Livre (comissão do tipo de anúncio, frete grátis a partir de R$ 79 e custo operacional abaixo disso) entram automaticamente conforme a faixa de preço.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;!-- ENTRADAS --&gt;
    &lt;aside class=&quot;panel&quot; aria-label=&quot;Seus dados&quot;&gt;
      &lt;h2&gt;Seus dados&lt;/h2&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Tipo de anúncio&lt;/label&gt;
        &lt;div class=&quot;seg-tog&quot; role=&quot;radiogroup&quot; aria-label=&quot;Tipo de anúncio&quot;&gt;
          &lt;button type=&quot;button&quot; data-tipo=&quot;classico&quot; role=&quot;radio&quot;&gt;Clássico&lt;/button&gt;
          &lt;button type=&quot;button&quot; data-tipo=&quot;premium&quot; role=&quot;radio&quot;&gt;Premium&lt;/button&gt;
        &lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;custo&quot;&gt;Custo do produto&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;custo&quot; inputmode=&quot;decimal&quot; data-key=&quot;custo&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;margem&quot;&gt;Margem desejada sobre o custo&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;margem&quot; inputmode=&quot;decimal&quot; data-key=&quot;margem&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;emb&quot;&gt;Embalagem&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;emb&quot; inputmode=&quot;decimal&quot; data-key=&quot;emb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;vend&quot;&gt;Comissão do vendedor&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;vend&quot; inputmode=&quot;decimal&quot; data-key=&quot;vend&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;ads&quot;&gt;ADS&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;ads&quot; inputmode=&quot;decimal&quot; data-key=&quot;ads&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;nf&quot;&gt;Nota fiscal&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;nf&quot; inputmode=&quot;decimal&quot; data-key=&quot;nf&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;desc&quot;&gt;Desconto da promoção&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;desc&quot; inputmode=&quot;decimal&quot; data-key=&quot;desc&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;O preço cheio é calculado para que, com esse desconto, o preço final seja o preço promocional&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arred&quot;&gt;Final do preço promocional&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;select id=&quot;arred&quot; data-key=&quot;arred&quot;&gt;
          &lt;option value=&quot;exato&quot;&gt;Exato (mínimo para a margem)&lt;/option&gt;
          &lt;option value=&quot;90&quot;&gt;Terminar em ,90&lt;/option&gt;
          &lt;option value=&quot;99&quot;&gt;Terminar em ,99&lt;/option&gt;
          &lt;option value=&quot;98&quot;&gt;Terminar em ,98&lt;/option&gt;
        &lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;row-actions&quot;&gt;&lt;button id=&quot;reset-inputs&quot; type=&quot;button&quot;&gt;Limpar para o exemplo&lt;/button&gt;&lt;/div&gt;
    &lt;/aside&gt;

    &lt;!-- RESULTADOS --&gt;
    &lt;main&gt;
      &lt;section class=&quot;hero&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;promo&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço promocional (o que o cliente paga)&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;promoV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;promoS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;full&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço cheio para cadastrar&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;fullV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;fullS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;compare&quot; aria-label=&quot;Clássico x Premium&quot;&gt;
        &lt;div id=&quot;cmpC&quot; data-tipo=&quot;classico&quot;&gt;&lt;div class=&quot;k&quot;&gt;Clássico&lt;/div&gt;&lt;div class=&quot;v&quot; id=&quot;cmpCV&quot;&gt;–&lt;/div&gt;&lt;div class=&quot;s&quot; id=&quot;cmpCS&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div id=&quot;cmpP&quot; data-tipo=&quot;premium&quot;&gt;&lt;div class=&quot;k&quot;&gt;Premium&lt;/div&gt;&lt;div class=&quot;v&quot; id=&quot;cmpPV&quot;&gt;–&lt;/div&gt;&lt;div class=&quot;s&quot; id=&quot;cmpPS&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ruler panel&quot; style=&quot;margin-top:20px&quot; aria-label=&quot;Faixas de custo do Mercado Livre&quot;&gt;
        &lt;h2&gt;Onde seus preços caem nas faixas do Mercado Livre&lt;/h2&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;inner&quot; id=&quot;inner&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;lp&quot;&gt;Preço promocional&lt;/span&gt;&lt;span class=&quot;lf&quot;&gt;Preço cheio&lt;/span&gt;&lt;span class=&quot;lb&quot;&gt;Faixa do preço promocional&lt;/span&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;div class=&quot;alerts&quot; id=&quot;alerts&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;tables&quot;&gt;
        &lt;section class=&quot;panel&quot;&gt;
          &lt;h2&gt;Composição no preço promocional&lt;/h2&gt;
          &lt;div class=&quot;sub&quot; id=&quot;subPromo&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tPromo&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;panel&quot;&gt;
          &lt;h2&gt;Composição no preço cheio&lt;/h2&gt;
          &lt;div class=&quot;sub&quot; id=&quot;subFull&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tFull&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;

      &lt;section class=&quot;panel&quot; style=&quot;margin-top:20px&quot;&gt;
        &lt;h2&gt;Simular outro preço&lt;/h2&gt;
        &lt;div class=&quot;sim&quot;&gt;
          &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;simP&quot;&gt;Preço de venda final&lt;/label&gt;
            &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;simP&quot; inputmode=&quot;decimal&quot; placeholder=&quot;Ex.: 94,90&quot; data-key=&quot;simP&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scroll&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table id=&quot;tSim&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;details class=&quot;panel&quot; id=&quot;tabDetails&quot;&gt;
        &lt;summary&gt;Tabela de taxas do Mercado Livre&lt;/summary&gt;
        &lt;p class=&quot;note&quot; style=&quot;margin:12px 0&quot;&gt;A partir de R$ 79 o frete grátis é obrigatório e está fixado em R$ 21,90. Abaixo de R$ 79 o Mercado Livre cobra um custo operacional por unidade, que desde março/2026 varia por peso e medidas (o valor padrão é uma referência: confira o seu no simulador de custos do ML). Edite aqui se algo mudar: os cálculos se atualizam e ficam salvos neste navegador.&lt;/p&gt;
        &lt;div class=&quot;fees&quot;&gt;
          &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;pctC&quot;&gt;Comissão Clássico&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;pctC&quot; inputmode=&quot;decimal&quot; data-fee=&quot;classico&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;pctP&quot;&gt;Comissão Premium&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;pctP&quot; inputmode=&quot;decimal&quot; data-fee=&quot;premium&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl-edit&quot; id=&quot;tBands&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;div class=&quot;row-actions&quot;&gt;
          &lt;button type=&quot;button&quot; id=&quot;resetBands&quot;&gt;Restaurar valores padrão&lt;/button&gt;
          &lt;span class=&quot;note&quot; id=&quot;bandsStatus&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/main&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  var DEFAULT_INPUTS = {custo:&quot;34,56&quot;, margem:&quot;30&quot;, emb:&quot;1,00&quot;, vend:&quot;3&quot;, ads:&quot;10&quot;, nf:&quot;10&quot;, desc:&quot;30&quot;, arred:&quot;exato&quot;, simP:&quot;&quot;, tipo:&quot;classico&quot;};
  var DEFAULT_FEES = {classico:14, premium:19};
  // meia = taxa fixa é 50% do preço (itens abaixo de R$ 8)
  // meia = custo é 50% do preço; nome = como aparece na composição
  var DEFAULT_BANDS = [
    {min:0,    max:12.49,    fixo:0,     meia:true,  nome:&quot;Custo operacional ML&quot;},
    {min:12.5, max:78.99,    fixo:7.95,  meia:false, nome:&quot;Custo operacional ML&quot;},
    {min:79,   max:Infinity, fixo:21.90, meia:false, nome:&quot;Frete grátis (fixo)&quot;}
  ];
  var LS_IN = &quot;mlPricing.inputs.v1&quot;, LS_B = &quot;mlPricing.bands.v1&quot;, LS_F = &quot;mlPricing.fees.v1&quot;;

  function load(key, fallback){
    try{ var raw = localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }catch(e){ return fallback; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  var inputs = Object.assign({}, DEFAULT_INPUTS, load(LS_IN, {}));
  var bands = (load(LS_B, null) || DEFAULT_BANDS).map(function(b){ return Object.assign({}, b, {max: (b.max===null||b.max===&quot;inf&quot;) ? Infinity : b.max}); });

  var fees = Object.assign({}, DEFAULT_FEES, load(LS_F, {}));
  var $ = function(id){ return document.getElementById(id); };
  var num = function(s){ if(s===undefined||s===null) return NaN; s=String(s).trim().replace(/\s/g,&quot;&quot;).replace(&quot;R$&quot;,&quot;&quot;); if(s.indexOf(&quot;,&quot;)&gt;-1){ s=s.replace(/\./g,&quot;&quot;).replace(&quot;,&quot;,&quot;.&quot;); } return parseFloat(s); };
  var brl = function(v){ return isFinite(v) ? v.toLocaleString(&quot;pt-BR&quot;,{style:&quot;currency&quot;,currency:&quot;BRL&quot;}) : &quot;–&quot;; };
  var pct = function(v,d){ return isFinite(v) ? (v*100).toLocaleString(&quot;pt-BR&quot;,{minimumFractionDigits:d===undefined?1:d,maximumFractionDigits:d===undefined?1:d})+&quot;%&quot; : &quot;–&quot;; };
  var r2 = function(v){ return Math.round(v*100)/100; };
  var fmtN = function(v){ return v===Infinity ? &quot;&quot; : String(v).replace(&quot;.&quot;,&quot;,&quot;); };

  function bandOf(P){
    for(var i=0;i&lt;bands.length;i++){ if(P&gt;=bands[i].min-1e-9 &amp;&amp; P&lt;=bands[i].max+0.004) return i; }
    for(var j=0;j&lt;bands.length-1;j++){ if(P&gt;bands[j].max &amp;&amp; P&lt;bands[j+1].min) return j+1; }
    return bands.length-1;
  }

  function params(){
    return {
      C:num(inputs.custo)||0, M:(num(inputs.margem)||0)/100, E:num(inputs.emb)||0,
      v:(num(inputs.vend)||0)/100, a:(num(inputs.ads)||0)/100, n:(num(inputs.nf)||0)/100,
      d:(num(inputs.desc)||0)/100,
      tipo: inputs.tipo===&quot;premium&quot; ? &quot;premium&quot; : &quot;classico&quot;
    };
  }

  function breakdown(P, p){
    var bi = bandOf(P), b = bands[bi];
    var com = P*fees[p.tipo]/100, fixo = b.meia ? P*0.5 : b.fixo;
    var vend = P*p.v, ads = P*p.a, nf = P*p.n;
    var lucro = P - com - fixo - vend - ads - nf - p.C - p.E;
    return {P:P, bi:bi, b:b, com:com, fixo:fixo, vend:vend, ads:ads, nf:nf, lucro:lucro,
            mCusto: p.C&gt;0 ? lucro/p.C : NaN, mVenda: P&gt;0 ? lucro/P : NaN};
  }

  // menor preço que atinge o lucro-alvo
  function minPrice(p){
    var L = p.C*p.M, best = null;
    bands.forEach(function(b){
      var denom = 1 - fees[p.tipo]/100 - p.v - p.a - p.n - (b.meia?0.5:0);
      if(denom&lt;=0) return;
      var P = (p.C + p.E + (b.meia?0:b.fixo) + L)/denom;
      if(P &lt; b.min) P = b.min;
      if(P &gt; b.max + 1e-9) return;
      P = Math.ceil(P*100 - 1e-6)/100;
      if(P &gt; b.max + 1e-9) return;
      if(best===null || P &lt; best) best = P;
    });
    return best;
  }

  function applyEnding(P, mode){
    if(mode===&quot;exato&quot;) return P;
    var cents = parseInt(mode,10)/100, bi = bandOf(P), max = bands[bi].max;
    var base = Math.floor(P), cand = base + cents;
    if(cand &lt; P - 1e-9) cand += 1;

.marker i{position:absolute;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:6px}
.marker.promo{top:0}
.marker.promo::before{top:22px;border-top:8px solid var(--plum)}
.marker.promo i{top:0;background:var(--plum);color:var(--panel)}
.marker.full{bottom:0}
.marker.full::before{bottom:22px;border-bottom:8px solid var(--muted)}
.marker.full i{bottom:0;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.ruler .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.ruler .legend span::before{content:&quot;&quot;;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ruler .legend .lp::before{background:var(--plum)}
.ruler .legend .lf::before{background:var(--panel);border:1px solid var(--muted)}
.ruler .legend .lb::before{background:var(--plum-soft);box-shadow:inset 0 0 0 2px var(--plum)}

.alerts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.alert{padding:10px 14px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.alert.ok{background:var(--profit-soft);border-left-color:var(--profit)}

.tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:720px){.tables{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-bottom:0;padding-top:10px}
tr.total td.n{color:var(--profit)}
tr.neg td.n{color:var(--warn)}
.sub{font-size:12px;color:var(--muted);margin:-8px 0 12px}

details{margin-top:20px}
summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:&quot;+&quot;;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--plum-soft);color:var(--plum);font-weight:800}
details[open] summary::before{content:&quot;−&quot;}
.tbl-edit{table-layout:fixed;min-width:560px}
.tbl-edit th,.tbl-edit td{padding:8px 6px;vertical-align:middle}
.tbl-edit th{text-align:right}
.tbl-edit th:first-child,.tbl-edit td:first-child{width:56px;text-align:center}
.tbl-edit td.n{text-align:right;padding-right:14px}
.tbl-edit input{display:block;width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink);font:inherit;font-weight:600;padding:6px 8px;text-align:right}
.tbl-edit input:focus{outline:none;border-color:var(--plum);box-shadow:0 0 0 3px var(--plum-soft)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button{font:inherit;font-weight:700;font-size:13px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--plum);border-color:var(--plum);color:var(--panel)}
button:focus-visible{outline:3px solid var(--plum-soft);outline-offset:1px}
.note{font-size:12px;color:var(--muted)}
.env{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 16px;background:var(--field)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--plum)}
.env-f{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.env-f .field{margin:0}
@media (max-width:560px){.env-f{grid-template-columns:1fr}}
.sim{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.sim .field{margin:0;flex:1;min-width:160px}
&lt;/style&gt;
&lt;style&gt;header{display:none}.wrap{padding-top:0}.grid{margin-top:16px}&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;Precificação TikTok Shop&lt;/h1&gt;
    &lt;p&gt;Preencha seus custos e metas. As taxas do TikTok Shop (comissão, tarifa fixa por item e taxa do Programa de Envio) entram automaticamente conforme a faixa de preço.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;!-- ENTRADAS --&gt;
    &lt;aside class=&quot;panel&quot; aria-label=&quot;Seus dados&quot;&gt;
      &lt;h2&gt;Seus dados&lt;/h2&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;custo&quot;&gt;Custo do produto&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;custo&quot; inputmode=&quot;decimal&quot; data-key=&quot;custo&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;margem&quot;&gt;Margem desejada sobre o custo&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;margem&quot; inputmode=&quot;decimal&quot; data-key=&quot;margem&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;emb&quot;&gt;Embalagem&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;emb&quot; inputmode=&quot;decimal&quot; data-key=&quot;emb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;vend&quot;&gt;Comissão do vendedor&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;vend&quot; inputmode=&quot;decimal&quot; data-key=&quot;vend&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;ads&quot;&gt;ADS&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;ads&quot; inputmode=&quot;decimal&quot; data-key=&quot;ads&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;afil&quot;&gt;Comissão de afiliado/creator&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;afil&quot; inputmode=&quot;decimal&quot; data-key=&quot;afil&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda. Deixe 0 se não vender por afiliados&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;nf&quot;&gt;Nota fiscal&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;nf&quot; inputmode=&quot;decimal&quot; data-key=&quot;nf&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Sobre o preço de venda&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;sep&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;desc&quot;&gt;Desconto da promoção&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;desc&quot; inputmode=&quot;decimal&quot; data-key=&quot;desc&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;O preço cheio é calculado para que, com esse desconto, o preço final seja o preço promocional&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;arred&quot;&gt;Final do preço promocional&lt;/label&gt;
        &lt;div class=&quot;inp&quot;&gt;&lt;select id=&quot;arred&quot; data-key=&quot;arred&quot;&gt;
          &lt;option value=&quot;exato&quot;&gt;Exato (mínimo para a margem)&lt;/option&gt;
          &lt;option value=&quot;90&quot;&gt;Terminar em ,90&lt;/option&gt;
          &lt;option value=&quot;99&quot;&gt;Terminar em ,99&lt;/option&gt;
          &lt;option value=&quot;98&quot;&gt;Terminar em ,98&lt;/option&gt;
        &lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;row-actions&quot;&gt;&lt;button id=&quot;reset-inputs&quot; type=&quot;button&quot;&gt;Limpar para o exemplo&lt;/button&gt;&lt;/div&gt;
    &lt;/aside&gt;

    &lt;!-- RESULTADOS --&gt;
    &lt;main&gt;
      &lt;section class=&quot;hero&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;promo&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço promocional (o que o cliente paga)&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;promoV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;promoS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;full&quot;&gt;
          &lt;div class=&quot;k&quot;&gt;Preço cheio para cadastrar&lt;/div&gt;
          &lt;div class=&quot;v&quot; id=&quot;fullV&quot;&gt;–&lt;/div&gt;
          &lt;div class=&quot;s&quot; id=&quot;fullS&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;ruler panel&quot; style=&quot;margin-top:20px&quot; aria-label=&quot;Faixas de taxa do TikTok Shop&quot;&gt;
        &lt;h2&gt;Onde seus preços caem nas faixas do TikTok Shop&lt;/h2&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;inner&quot; id=&quot;inner&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;lp&quot;&gt;Preço promocional&lt;/span&gt;&lt;span class=&quot;lf&quot;&gt;Preço cheio&lt;/span&gt;&lt;span class=&quot;lb&quot;&gt;Faixa do preço promocional&lt;/span&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;div class=&quot;alerts&quot; id=&quot;alerts&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;tables&quot;&gt;
        &lt;section class=&quot;panel&quot;&gt;
          &lt;h2&gt;Composição no preço promocional&lt;/h2&gt;
          &lt;div class=&quot;sub&quot; id=&quot;subPromo&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tPromo&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;panel&quot;&gt;
          &lt;h2&gt;Composição no preço cheio&lt;/h2&gt;
          &lt;div class=&quot;sub&quot; id=&quot;subFull&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;tFull&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;

      &lt;section class=&quot;panel&quot; style=&quot;margin-top:20px&quot;&gt;
        &lt;h2&gt;Simular outro preço&lt;/h2&gt;
        &lt;div class=&quot;sim&quot;&gt;
          &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;simP&quot;&gt;Preço de venda final&lt;/label&gt;
            &lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;simP&quot; inputmode=&quot;decimal&quot; placeholder=&quot;Ex.: 94,90&quot; data-key=&quot;simP&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scroll&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table id=&quot;tSim&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;details class=&quot;panel&quot; id=&quot;tabDetails&quot;&gt;
        &lt;summary&gt;Tabela de taxas do TikTok Shop&lt;/summary&gt;
        &lt;p class=&quot;note&quot; style=&quot;margin:12px 0&quot;&gt;Vigente desde 15/07/2026. A comissão incide sobre o preço já com os descontos bancados por você; descontos e cupons pagos pelo TikTok não entram na conta. Se o TikTok mudar as taxas, edite aqui: os cálculos se atualizam e ficam salvos neste navegador.&lt;/p&gt;
        &lt;div class=&quot;env&quot;&gt;
          &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;envOn&quot;&gt; Participo do Programa de Taxas de Envio (frete grátis/reduzido)&lt;/label&gt;
          &lt;div class=&quot;env-f&quot;&gt;
            &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;envPct&quot;&gt;Taxa de serviço do envio&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;&lt;input id=&quot;envPct&quot; inputmode=&quot;decimal&quot;&gt;&lt;span&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;envTeto&quot;&gt;Teto por item&lt;/label&gt;&lt;div class=&quot;inp&quot;&gt;&lt;span&gt;R$&lt;/span&gt;&lt;input id=&quot;envTeto&quot; inputmode=&quot;decimal&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl-edit&quot; id=&quot;tBands&quot;&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;div class=&quot;row-actions&quot;&gt;
          &lt;button type=&quot;button&quot; id=&quot;resetBands&quot;&gt;Restaurar tabela de julho/2026&lt;/button&gt;
          &lt;span class=&quot;note&quot; id=&quot;bandsStatus&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/details&gt;
    &lt;/main&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  var DEFAULT_INPUTS = {custo:&quot;34,56&quot;, margem:&quot;30&quot;, emb:&quot;1,00&quot;, vend:&quot;3&quot;, ads:&quot;10&quot;, nf:&quot;10&quot;, afil:&quot;0&quot;, desc:&quot;30&quot;, arred:&quot;exato&quot;, simP:&quot;&quot;};
  var DEFAULT_ENV = {on:true, pct:6, teto:50};
  var DEFAULT_BANDS = [
    {min:0,  max:49.99,    pct:10, fixo:4, meia:false},
    {min:50, max:Infinity, pct:6,  fixo:6, meia:false}
  ];
  var LS_IN = &quot;ttsPricing.inputs.v1&quot;, LS_B = &quot;ttsPricing.bands.v1&quot;, LS_E = &quot;ttsPricing.env.v1&quot;;

  function load(key, fallback){
    try{ var raw = localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }catch(e){ return fallback; }
  }
  function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  var inputs = Object.assign({}, DEFAULT_INPUTS, load(LS_IN, {}));
  var bands = (load(LS_B, null) || DEFAULT_BANDS).map(function(b){ return Object.assign({}, b, {max: (b.max===null||b.max===&quot;inf&quot;) ? Infinity : b.max}); });

  var env = Object.assign({}, DEFAULT_ENV, load(LS_E, {}));
  var $ = function(id){ return document.getElementById(id); };
  var num = function(s){ if(s===undefined||s===null) return NaN; s=String(s).trim().replace(/\s/g,&quot;&quot;).replace(&quot;R$&quot;,&quot;&quot;); if(s.indexOf(&quot;,&quot;)&gt;-1){ s=s.replace(/\./g,&quot;&quot;).replace(&quot;,&quot;,&quot;.&quot;); } return parseFloat(s); };
  var brl = function(v){ return isFinite(v) ? v.toLocaleString(&quot;pt-BR&quot;,{style:&quot;currency&quot;,currency:&quot;BRL&quot;}) : &quot;–&quot;; };
  var pct = function(v,d){ return isFinite(v) ? (v*100).toLocaleString(&quot;pt-BR&quot;,{minimumFractionDigits:d===undefined?1:d,maximumFractionDigits:d===undefined?1:d})+&quot;%&quot; : &quot;–&quot;; };
  var r2 = function(v){ return Math.round(v*100)/100; };
  var fmtN = function(v){ return v===Infinity ? &quot;&quot; : String(v).replace(&quot;.&quot;,&quot;,&quot;); };

  function bandOf(P){
    for(var i=0;i&lt;bands.length;i++){ if(P&gt;=bands[i].min-1e-9 &amp;&amp; P&lt;=bands[i].max+0.004) return i; }
    for(var j=0;j&lt;bands.length-1;j++){ if(P&gt;bands[j].max &amp;&amp; P&lt;bands[j+1].min) return j+1; }
    return bands.length-1;
  }

  function params(){
    return {
      C:num(inputs.custo)||0, M:(num(inputs.margem)||0)/100, E:num(inputs.emb)||0,
      v:(num(inputs.vend)||0)/100, a:(num(inputs.ads)||0)/100, n:(num(inputs.nf)||0)/100,
      d:(num(inputs.desc)||0)/100,
      f:(num(inputs.afil)||0)/100
    };
  }

  function breakdown(P, p){
    var bi = bandOf(P), b = bands[bi];
    var com = P*b.pct/100, fixo = b.meia ? P*0.5 : b.fixo;
    var vend = P*p.v, ads = P*p.a, nf = P*p.n, afil = P*p.f;
    var envio = env.on ? Math.min(P*env.pct/100, env.teto) : 0;
    var lucro = P - com - fixo - vend - ads - nf - afil - envio - p.C - p.E;
    return {P:P, bi:bi, b:b, com:com, fixo:fixo, vend:vend, ads:ads, nf:nf, afil:afil, envio:envio, lucro:lucro,
            mCusto: p.C&gt;0 ? lucro/p.C : NaN, mVenda: P&gt;0 ? lucro/P : NaN};
  }

  // menor preço que atinge o lucro-alvo
  function minPrice(p){
    var L = p.C*p.M, best = null;
    bands.forEach(function(b){
      var ep = env.on ? env.pct/100 : 0;
      var base = 1 - b.pct/100 - p.v - p.a - p.n - p.f - (b.meia?0.5:0);
      var denom = base - ep;
      if(denom&lt;=0) return;
      var P = (p.C + p.E + (b.meia?0:b.fixo) + L)/denom;
      if(env.on &amp;&amp; P*ep &gt; env.teto){ if(base&lt;=0) return; P = (p.C + p.E + (b.meia?0:b.fixo) + env.teto + L)/base; }
      if(P &lt; b.min) P = b.min;
      if(P &gt; b.max + 1e-9) return;
      P = Math.ceil(P*100 - 1e-6)/100;
      if(P &gt; b.max + 1e-9) return;
      if(best===null || P &lt; best) best = P;
    });
    return best;
  }

  function applyEnding(P, mode){
    if(mode===&quot;exato&quot;) return P;
    var cents = parseInt(mode,10)/100, bi = bandOf(P), max = bands[bi].max;
    var base = Math.floor(P), cand = base + cents;
    if(cand &lt; P - 1e-9) cand += 1;
    cand = r2(cand);
    if(cand &gt; max + 1e-9) return {P:P, clipped:true};
    return cand;
  }

  function fullFromPromo(promo, d, p){
    if(d&lt;=0) return {full:promo, promoReal:promo};
    if(d&gt;=1) return null;
    var full = Math.ceil(promo/(1-d)*100 - 1e-6)/100;
    var real = r2(full*(1-d));
    var maxBand = bands[bandOf(promo)].max;
    var guard = 0;
    while(real &gt; maxBand + 1e-9 &amp;&amp; guard&lt;5){ full = r2(full-0.01); real = r2(full*(1-d)); guard++; }
    return {full:full, promoReal:real};
  }

  function rows(bd, p){
    var labelFixo = &quot;Tarifa fixa por item&quot;;
    var list = [
      [&quot;Preço de venda&quot;, &quot;100,0%&quot;, bd.P, &quot;&quot;],
      [&quot;Comissão TikTok Shop&quot;, pct(bd.b.pct/100), -bd.com, &quot;&quot;],
      [labelFixo, &quot;&quot;, -bd.fixo, &quot;&quot;],
      [&quot;Programa de envio&quot;+(env.on &amp;&amp; bd.envio&gt;=env.teto-0.001?&quot; (teto)&quot;:&quot;&quot;), env.on &amp;&amp; bd.envio&lt;env.teto-0.001 ? pct(env.pct/100) : &quot;&quot;, -bd.envio, &quot;&quot;],
      [&quot;Comissão do vendedor&quot;, pct(p.v), -bd.vend, &quot;&quot;],
      [&quot;ADS&quot;, pct(p.a), -bd.ads, &quot;&quot;],
      [&quot;Nota fiscal&quot;, pct(p.n), -bd.nf, &quot;&quot;],
      [&quot;Afiliado/creator&quot;, pct(p.f), -bd.afil, &quot;&quot;],
      [&quot;Custo do produto&quot;, &quot;&quot;, -p.C, &quot;&quot;],
      [&quot;Embalagem&quot;, &quot;&quot;, -p.E, &quot;&quot;]
    ];
    var h = &#x27;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;%&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;R$&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    list.forEach(function(r){ h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+r[1]+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+brl(r[2])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;; });
    h += &#x27;&lt;tr class=&quot;total&#x27;+(bd.lucro&lt;0?&#x27; neg&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;td&gt;Lucro líquido&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+pct(bd.mVenda)+&#x27;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&#x27;+brl(bd.lucro)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;

    return h + &#x27;&lt;/tbody&gt;&#x27;;

  function bandLabel(b){
    if(b.min===0) return &quot;Até &quot;+brl(b.max);

    return brl(b.min)+&quot; a &quot;+brl(b.max);

  function bandFee(b){ return b.pct+&quot;% + &quot;+brl(b.fixo)+(env.on?&quot; + envio &quot;+fmtN(env.pct)+&quot;%&quot;:&quot;&quot;); }

  function drawRuler(promoBd, fullBd){
    var bar = $(&quot;bar&quot;), inner = $(&quot;inner&quot;);
    var h = &quot;&quot;;
    bands.forEach(function(b,i){
      var on = (promoBd &amp;&amp; promoBd.bi===i) ? &quot; on&quot; : &quot;&quot;;
      h += &#x27;&lt;div class=&quot;seg&#x27;+on+&#x27;&quot;&gt;&lt;b&gt;&#x27;+bandFee(b)+&#x27;&lt;/b&gt;&lt;span&gt;&#x27;+bandLabel(b)+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    });

    inner.querySelectorAll(&quot;.marker&quot;).forEach(function(m){ m.remove(); });
    function place(bd, cls, text){
      if(!bd) return;
      var b = bands[bd.bi], w = 100/bands.length;

    if(fullBd &amp;&amp; (!promoBd || fullBd.P!==promoBd.P)) place(fullBd, &quot;full&quot;, &quot;Cheio &quot;+brl(fullBd.P));
  }

  function drawBandsTable(){
    var h = &#x27;&lt;colgroup&gt;&lt;col style=&quot;width:56px&quot;&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;/colgroup&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Faixa&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;De (R$)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Até (R$)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Comissão (%)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Taxa fixa (R$)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
    bands.forEach(function(b,i){
      h += &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+(i+1)+&#x27;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;min&quot; value=&quot;&#x27;+fmtN(b.min)+&#x27;&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; valor inicial&quot;&gt;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;max&quot; value=&quot;&#x27;+(b.max===Infinity?&quot;&quot;:fmtN(b.max))+&#x27;&quot; placeholder=&quot;sem limite&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; valor final&quot;&gt;&lt;/td&gt;&#x27;+
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;pct&quot; value=&quot;&#x27;+fmtN(b.pct)+&#x27;&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; comissão&quot;&gt;&lt;/td&gt;&#x27;+
        (b.meia ? &#x27;&lt;td class=&quot;n note&quot;&gt;50% do preço&lt;/td&gt;&#x27; :
        &#x27;&lt;td&gt;&lt;input data-b=&quot;&#x27;+i+&#x27;&quot; data-f=&quot;fixo&quot; value=&quot;&#x27;+fmtN(b.fixo)+&#x27;&quot; inputmode=&quot;decimal&quot; aria-label=&quot;Faixa &#x27;+(i+1)+&#x27; taxa fixa&quot;&gt;&lt;/td&gt;&#x27;)+

  function render(){

    if(minP===null || !(p.C&gt;0)){
      $(&quot;promoV&quot;).textContent = &quot;–&quot;; $(&quot;fullV&quot;).textContent = &quot;–&quot;;

      $(&quot;tPromo&quot;).innerHTML = &quot;&quot;; $(&quot;tFull&quot;).innerHTML = &quot;&quot;; $(&quot;subPromo&quot;).textContent=&quot;&quot;; $(&quot;subFull&quot;).textContent=&quot;&quot;;
      if(p.C&gt;0) alerts.push([&quot;Os percentuais sobre a venda (TikTok + envio + vendedor + ADS + nota + afiliado) somam 100% ou mais. Reduza algum deles.&quot;, false]);
